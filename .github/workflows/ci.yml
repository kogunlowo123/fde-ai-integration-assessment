name: CI

# The whole pipeline runs on the deterministic mock provider: no paid API, no
# external model, no GPU, no API key. That is a design requirement, not a
# convenience, see COST-OPTIMIZATION.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy src

      - name: .env.example is in sync with Settings
        run: python scripts/gen_env_example.py --check

      - name: Tests
        run: pytest -q --cov=fde_assessment --cov-report=term-missing

      - name: Smoke test
        run: python scripts/smoke_test.py

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          # The console script must exist and the package must import without
          # the source tree present.
          /tmp/verify/bin/python -c "import fde_assessment; print(fde_assessment.__version__)"
          test -x /tmp/verify/bin/fde-mcp-server

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fde-assessment:ci .

      - name: Image runs as a non-root user
        run: |
          user=$(docker run --rm fde-assessment:ci id -u)
          test "$user" != "0" || { echo "container runs as root"; exit 1; }
          echo "container uid: $user"

      - name: Gateway answers its health check
        run: |
          docker run -d --name llm-gw -p 8001:8001 \
            -e BIND_HOST=0.0.0.0 -e APP_ENV=development -e DATABASE_PATH=/tmp/gateway.db \
            fde-assessment:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs llm-gw
          docker rm -f llm-gw
          test "${ok:-0}" = "1"
